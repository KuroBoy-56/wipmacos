name: Tauri desktop (migration)

# MPX Player on Tauri 2 + Rust (apps/tauri-desktop). Runs on the migration branch and on PRs that touch it.
# Builds artifacts only: nothing is published or released from here (docs/RELEASE_PROCESS.md).

on:
    push:
        branches:
            - migration/tauri-rust
        paths:
            - 'apps/tauri-desktop/**'
            - 'apps/web/**'
            - 'libs/**'
            - '.github/workflows/tauri-desktop.yml'
    pull_request:
        paths:
            - 'apps/tauri-desktop/**'
            - '.github/workflows/tauri-desktop.yml'
    workflow_dispatch:

concurrency:
    group: tauri-desktop-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    rust:
        name: Rust checks (Linux)
        runs-on: ubuntu-24.04
        defaults:
            run:
                working-directory: apps/tauri-desktop/src-tauri
        steps:
            - uses: actions/checkout@v4
            - name: System libraries
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
            - uses: dtolnay/rust-toolchain@stable
              with:
                  components: clippy, rustfmt
            - uses: Swatinem/rust-cache@v2
              with:
                  workspaces: apps/tauri-desktop/src-tauri
            - run: cargo fmt --check
            - run: cargo clippy --all-targets -- -D warnings
            - run: cargo test

    windows:
        name: Windows x64 installers (NSIS + MSI)
        needs: rust
        runs-on: windows-2022
        timeout-minutes: 90
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: 'pnpm'
            - name: Install dependencies
              run: pnpm install --frozen-lockfile
            - name: Inject TMDB API key
              env:
                  TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
              run: node tools/tmdb/inject-tmdb-key.mjs
            - name: Build the Angular app (shared with Electron)
              run: pnpm nx build web
            - uses: dtolnay/rust-toolchain@stable
            - uses: Swatinem/rust-cache@v2
              with:
                  workspaces: apps/tauri-desktop/src-tauri
            - name: Tauri CLI
              run: cargo install tauri-cli --version "^2" --locked
            - name: Build installers
              working-directory: apps/tauri-desktop/src-tauri
              env:
                  # Compiled into the binary by build.rs; without it the login reports NO_MASTER_KEY.
                  PANEL_MASTER_KEY: ${{ secrets.PANEL_MASTER_KEY }}
              run: cargo tauri build --bundles nsis,msi
            - uses: actions/upload-artifact@v4
              with:
                  name: mpx-player-tauri-windows-x64
                  path: |
                      apps/tauri-desktop/src-tauri/target/release/bundle/nsis/*.exe
                      apps/tauri-desktop/src-tauri/target/release/bundle/msi/*.msi
                  if-no-files-found: error
