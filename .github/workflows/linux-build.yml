name: Build Linux (deb, AppImage, rpm, Snap, Flatpak)

# MPX Player for Linux (branch `linux`). Builds and tests the packages; it never publishes them
# (Snap Store / Flathub uploads need the owner's approval, docs/LINUX_PACKAGING.md).
# Started only on demand: push a tag `linux-v*` (e.g. linux-v1.5.24-1). "Run workflow" also works
# once this file exists on the default branch (GitHub requirement for workflow_dispatch).

on:
    push:
        tags:
            - 'linux-v*'
    workflow_dispatch:

concurrency:
    group: linux-build-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    electron:
        name: Electron app (linux-unpacked, deb, AppImage, rpm)
        # glibc 2.35: the native modules also load on Ubuntu 22.04 / Debian 12 and in the
        # core24 and freedesktop runtimes used by the Snap and the Flatpak.
        runs-on: ubuntu-22.04
        timeout-minutes: 90
        env:
            # Embedded MPV on Linux: an X11 child window + a separate `mpv --wid` process.
            IPTVNATOR_BUILD_EMBEDDED_MPV: '1'
            IPTVNATOR_EMBEDDED_MPV_PLATFORM: linux
            IPTVNATOR_EMBEDDED_MPV_ARCH: x64
            IPTVNATOR_REQUIRE_EMBEDDED_MPV: '1'
        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: 'pnpm'

            - name: Linux build dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install --no-install-recommends -y rpm libarchive-tools libx11-dev libxext-dev \
                      libmpv-dev mpv pkg-config xvfb appstream desktop-file-utils

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Inject TMDB API key
              env:
                  TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
              run: node tools/tmdb/inject-tmdb-key.mjs

            - name: Write panel key
              # No-op without the secret: the login screen then reports the missing key.
              env:
                  PANEL_MASTER_KEY: ${{ secrets.PANEL_MASTER_KEY }}
              run: node tools/panel/write-panel-key.mjs

            - name: Unit tests of the Linux changes
              run: |
                  pnpm nx test database --testPathPatterns=path-utils
                  pnpm nx test electron-backend --testPathPatterns='(player\.events|embedded-mpv-native\.service)\.spec'
                  node --test tools/packaging/linux-after-pack.test.mjs

            - name: Build frontend
              run: pnpm nx build web --skip-nx-cache

            - name: Stage Linux embedded MPV build inputs
              shell: bash
              run: |
                  set -euo pipefail
                  RUNTIME_PREFIX="${RUNNER_TEMP}/embedded-mpv-runtime/linux-x64/prefix"
                  rm -rf "${RUNTIME_PREFIX}"
                  mkdir -p "${RUNTIME_PREFIX}/include"
                  cp -a /usr/include/mpv "${RUNTIME_PREFIX}/include/"
                  LIBMPV_DEV_VERSION="$(dpkg-query -W -f='${Version}' libmpv-dev)"
                  MPV_VERSION="$(dpkg-query -W -f='${Version}' mpv)"
                  export RUNTIME_PREFIX LIBMPV_DEV_VERSION MPV_VERSION
                  node -e "
                    const fs = require('fs');
                    fs.writeFileSync(process.env.RUNTIME_PREFIX + '/runtime-manifest.json', JSON.stringify({
                      linuxBackend: 'process-isolated mpv --wid',
                      buildInputs: { libmpvDevPackage: process.env.LIBMPV_DEV_VERSION, mpvPackage: process.env.MPV_VERSION },
                      sourceDistribution: 'Linux build inputs come from Ubuntu packages. Playback runs the mpv program of the package (Snap/Flatpak) or of the system (.deb/.rpm/AppImage); libmpv is not loaded in the Electron process.',
                    }, null, 2) + '\n');
                  "
                  pnpm embedded-mpv:stage-runtime -- linux x64 "${RUNTIME_PREFIX}"

            - name: Build backend
              run: pnpm run build:backend

            - name: Verify embedded MPV build output
              shell: bash
              run: |
                  set -euo pipefail
                  test -f dist/apps/electron-backend/native/embedded_mpv.node
                  node -e "const m = require('./dist/apps/electron-backend/native/embedded-mpv-runtime.json'); if (m.origin !== 'external-mpv-process') throw new Error('Linux embedded MPV manifest must use external-mpv-process origin.');"
                  if ldd dist/apps/electron-backend/native/embedded_mpv.node | grep -q libmpv; then
                      echo "::error::The Linux embedded MPV addon must not link libmpv"; exit 1
                  fi

            - name: Package (linux-unpacked, AppImage, deb, rpm)
              run: pnpm run make:app -- --publishPolicy=never

            - name: Verify package layout
              run: pnpm run verify:package-layout -- linux x64

            - name: Validate desktop and AppStream metadata
              run: |
                  appstreamcli validate --no-net apps/electron-backend/linux/com.latmpx.MPXPlayer.metainfo.xml
                  desktop-file-validate apps/electron-backend/linux/com.latmpx.MPXPlayer.desktop
                  dpkg-deb -c dist/executables/*.deb | grep -E "usr/share/(applications|icons)/" || (echo "::error::deb without desktop entry or icons"; exit 1)

            - name: Smoke test (linux-unpacked)
              run: |
                  xvfb-run -a node tools/linux/smoke-test.mjs --expect-embedded-mpv --screenshot=smoke-linux-unpacked.png -- \
                      dist/executables/linux-unpacked/mpx-player.bin --no-sandbox

            - name: Pack linux-unpacked for the Snap and the Flatpak
              run: tar -C dist/executables/linux-unpacked -czf mpx-player-linux-x64.tar.gz .

            - uses: actions/upload-artifact@v4
              with:
                  name: mpx-player-linux-packages
                  path: |
                      dist/executables/*.AppImage
                      dist/executables/*.deb
                      dist/executables/*.rpm
                      smoke-linux-unpacked.png
                  if-no-files-found: error

            - uses: actions/upload-artifact@v4
              with:
                  name: mpx-player-linux-unpacked
                  path: mpx-player-linux-x64.tar.gz
                  if-no-files-found: error

    snap:
        name: Snap (core24, strict)
        needs: electron
        runs-on: ubuntu-24.04
        timeout-minutes: 60
        steps:
            - uses: actions/checkout@v4

            - uses: actions/download-artifact@v4
              with:
                  name: mpx-player-linux-unpacked

            - name: Unpack the Electron build for snapcraft
              run: mkdir -p build/linux-unpacked && tar -C build/linux-unpacked -xzf mpx-player-linux-x64.tar.gz

            - uses: snapcore/action-build@v1
              id: snapcraft

            - name: Install the snap and run the smoke test inside its confinement
              run: |
                  sudo apt-get update && sudo apt-get install --no-install-recommends -y xvfb
                  sudo snap install --dangerous "${{ steps.snapcraft.outputs.snap }}"
                  snap connections mpx-player
                  xvfb-run -a node tools/linux/smoke-test.mjs --expect-embedded-mpv --screenshot=smoke-snap.png -- /snap/bin/mpx-player

            - uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: mpx-player-snap
                  path: |
                      ${{ steps.snapcraft.outputs.snap }}
                      smoke-snap.png

    flatpak:
        name: Flatpak (freedesktop 26.08)
        needs: electron
        runs-on: ubuntu-24.04
        timeout-minutes: 90
        steps:
            - uses: actions/checkout@v4

            - uses: actions/download-artifact@v4
              with:
                  name: mpx-player-linux-unpacked
                  path: flatpak

            - name: Flatpak tooling and runtimes
              run: |
                  sudo apt-get update
                  sudo apt-get install --no-install-recommends -y flatpak flatpak-builder xvfb dbus-x11
                  flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
                  flatpak install --user -y --noninteractive flathub org.flatpak.Builder

            - name: Cache mpv modules
              uses: actions/cache@v4
              with:
                  path: flatpak/.flatpak-builder
                  key: flatpak-builder-${{ hashFiles('flatpak/com.latmpx.MPXPlayer.yml') }}
                  restore-keys: flatpak-builder-

            - name: Build and install
              working-directory: flatpak
              run: |
                  flatpak-builder --user --install-deps-from=flathub --install --force-clean \
                      --repo=repo build-dir com.latmpx.MPXPlayer.yml
                  flatpak build-bundle repo mpx-player.flatpak com.latmpx.MPXPlayer

            - name: Smoke test inside the Flatpak sandbox
              run: |
                  xvfb-run -a dbus-run-session -- node tools/linux/smoke-test.mjs --expect-embedded-mpv \
                      --screenshot=smoke-flatpak.png -- flatpak run com.latmpx.MPXPlayer

            - name: Flathub linter (report only)
              continue-on-error: true
              run: |
                  flatpak run --command=flatpak-builder-lint org.flatpak.Builder manifest flatpak/com.latmpx.MPXPlayer.yml
                  flatpak run --command=flatpak-builder-lint org.flatpak.Builder repo flatpak/repo

            - uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: mpx-player-flatpak
                  path: |
                      flatpak/mpx-player.flatpak
                      smoke-flatpak.png
