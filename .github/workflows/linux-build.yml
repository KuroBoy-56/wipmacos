name: Build Linux (deb, AppImage, rpm, Snap, Flatpak)

# MPX Player for Linux (branch `linux`). Builds and tests the packages and, when every test
# passes, publishes them as a GitHub release named after the tag. It never uploads to the Snap
# Store or Flathub (the owner does that, docs/LINUX_PACKAGING.md).
# Started only on demand: a push to `linux` whose commit message contains [linux build], or a tag
# `linux-v*`. The release is `linux-v<version of package.json>` (or the tag). "Run workflow" also
# works once this file exists on the default branch (GitHub requirement for workflow_dispatch).
# Needs the repository secret PANEL_MASTER_KEY (64 hex characters): without it the run stops.

on:
    push:
        branches:
            - linux
        tags:
            - 'linux-v*'
    workflow_dispatch:

concurrency:
    group: linux-build-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    electron:
        name: Electron app (linux-unpacked, deb, AppImage, rpm)
        # every other push to `linux` is ignored (the whole run is skipped)
        if: startsWith(github.ref, 'refs/tags/linux-v') || github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[linux build]')
        # glibc 2.35: the native modules also load on Ubuntu 22.04 / Debian 12 and in the
        # core24 and freedesktop runtimes used by the Snap and the Flatpak.
        runs-on: ubuntu-22.04
        outputs:
            version: ${{ steps.version.outputs.version }}
        timeout-minutes: 90
        env:
            # Embedded MPV on Linux: an X11 child window + a separate `mpv --wid` process.
            IPTVNATOR_BUILD_EMBEDDED_MPV: '1'
            IPTVNATOR_EMBEDDED_MPV_PLATFORM: linux
            IPTVNATOR_EMBEDDED_MPV_ARCH: x64
            IPTVNATOR_REQUIRE_EMBEDDED_MPV: '1'
        steps:
            - name: Require the panel key
              # a build without it cannot sign in to the panel: never package one
              env:
                  PANEL_MASTER_KEY: ${{ secrets.PANEL_MASTER_KEY }}
              run: |
                  if ! printf '%s' "$PANEL_MASTER_KEY" | grep -qE '^[0-9a-fA-F]{64}$'; then
                      echo "::error::Missing or invalid repository secret PANEL_MASTER_KEY (64 hex characters): Settings > Secrets and variables > Actions."
                      exit 1
                  fi

            - uses: actions/checkout@v4

            - name: Version
              id: version
              run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

            - uses: pnpm/action-setup@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: 'pnpm'

            - name: Linux build dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install --no-install-recommends -y rpm libarchive-tools libx11-dev libxext-dev \
                      libmpv-dev mpv pkg-config xvfb appstream desktop-file-utils

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Inject TMDB API key
              env:
                  TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
              run: node tools/tmdb/inject-tmdb-key.mjs

            - name: Write panel key
              env:
                  PANEL_MASTER_KEY: ${{ secrets.PANEL_MASTER_KEY }}
              run: node tools/panel/write-panel-key.mjs

            - name: Unit tests of the Linux changes
              run: |
                  pnpm nx test database --testPathPatterns=path-utils
                  pnpm nx test electron-backend --testPathPatterns='(external-player-launch-context|embedded-mpv-native\.service|bundled-mpv-path)\.spec'
                  node --test tools/packaging/linux-after-pack.test.mjs

            - name: Build frontend
              run: pnpm nx build web --skip-nx-cache

            - name: Stage Linux embedded MPV build inputs
              shell: bash
              run: |
                  set -euo pipefail
                  RUNTIME_PREFIX="${RUNNER_TEMP}/embedded-mpv-runtime/linux-x64/prefix"
                  rm -rf "${RUNTIME_PREFIX}"
                  mkdir -p "${RUNTIME_PREFIX}/include"
                  cp -a /usr/include/mpv "${RUNTIME_PREFIX}/include/"
                  LIBMPV_DEV_VERSION="$(dpkg-query -W -f='${Version}' libmpv-dev)"
                  MPV_VERSION="$(dpkg-query -W -f='${Version}' mpv)"
                  export RUNTIME_PREFIX LIBMPV_DEV_VERSION MPV_VERSION
                  node -e "
                    const fs = require('fs');
                    fs.writeFileSync(process.env.RUNTIME_PREFIX + '/runtime-manifest.json', JSON.stringify({
                      linuxBackend: 'process-isolated mpv --wid',
                      buildInputs: { libmpvDevPackage: process.env.LIBMPV_DEV_VERSION, mpvPackage: process.env.MPV_VERSION },
                      sourceDistribution: 'Linux build inputs come from Ubuntu packages. Playback runs the mpv program of the package (Snap/Flatpak) or of the system (.deb/.rpm/AppImage); libmpv is not loaded in the Electron process.',
                    }, null, 2) + '\n');
                  "
                  pnpm embedded-mpv:stage-runtime -- linux x64 "${RUNTIME_PREFIX}"

            - name: Build backend
              run: pnpm run build:backend

            - name: Verify embedded MPV build output
              shell: bash
              run: |
                  set -euo pipefail
                  test -f dist/apps/electron-backend/native/embedded_mpv.node
                  node -e "const m = require('./dist/apps/electron-backend/native/embedded-mpv-runtime.json'); if (m.origin !== 'external-mpv-process') throw new Error('Linux embedded MPV manifest must use external-mpv-process origin.');"
                  if ldd dist/apps/electron-backend/native/embedded_mpv.node | grep -q libmpv; then
                      echo "::error::The Linux embedded MPV addon must not link libmpv"; exit 1
                  fi

            - name: Portable mpv (AppImage, deb, rpm; the Snap and the Flatpak bring their own)
              run: tools/linux/bundle-mpv.sh bin/mpv

            - name: Panel key is in the build
              run: test -s dist/apps/electron-backend/assets/panel-key.json

            - name: Package (linux-unpacked, AppImage, deb, rpm)
              run: pnpm run make:app -- --publishPolicy=never

            - name: Bundled mpv is in the package
              run: dist/executables/linux-unpacked/resources/bin/mpv/mpv --version | head -n 1

            - name: Verify package layout
              run: pnpm run verify:package-layout -- linux x64

            - name: Validate desktop and AppStream metadata
              run: |
                  appstreamcli validate --no-net apps/electron-backend/linux/com.latmpx.MPXPlayer.metainfo.xml
                  desktop-file-validate apps/electron-backend/linux/com.latmpx.MPXPlayer.desktop
                  dpkg-deb -c dist/executables/*.deb | grep -E "usr/share/(applications|icons)/" || (echo "::error::deb without desktop entry or icons"; exit 1)

            - name: Smoke test (linux-unpacked)
              run: |
                  # system mpv out of the way: the bundled one must be the one that works
                  sudo apt-get remove -y mpv
                  timeout 600 xvfb-run -a node tools/linux/smoke-test.mjs --expect-embedded-mpv --expect-panel-key \
                      --screenshot=smoke-linux-unpacked.png -- dist/executables/linux-unpacked/mpx-player.bin --no-sandbox

            - name: Smoke test (AppImage)
              env:
                  # runners have no FUSE 2; the AppImage itself is what users download
                  APPIMAGE_EXTRACT_AND_RUN: '1'
              run: |
                  APP="$(ls dist/executables/*.AppImage | head -n 1)"
                  chmod +x "$APP"
                  timeout 600 xvfb-run -a node tools/linux/smoke-test.mjs --expect-embedded-mpv --expect-panel-key \
                      --screenshot=smoke-appimage.png -- "$APP" --no-sandbox

            - name: Pack linux-unpacked for the Snap and the Flatpak (without the portable mpv)
              run: |
                  tar -C dist/executables/linux-unpacked --exclude=./resources/bin -czf mpx-player-linux-x64.tar.gz .
                  tar -czf portable-mpv.tar.gz bin/mpv

            - uses: actions/upload-artifact@v4
              with:
                  name: mpx-player-linux-packages
                  path: |
                      dist/executables/*.AppImage
                      dist/executables/*.deb
                      dist/executables/*.rpm
                      smoke-linux-unpacked.png
                      smoke-appimage.png
                  if-no-files-found: error

            - uses: actions/upload-artifact@v4
              with:
                  name: mpx-player-linux-unpacked
                  path: mpx-player-linux-x64.tar.gz
                  if-no-files-found: error

            - uses: actions/upload-artifact@v4
              with:
                  name: portable-mpv
                  path: portable-mpv.tar.gz
                  if-no-files-found: error

    portable-mpv:
        name: Portable mpv on other distributions (${{ matrix.image }})
        needs: electron
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        strategy:
            fail-fast: false
            matrix:
                include:
                    # only what a desktop already has (X11, GL, ALSA, fonts); mpv's other libraries are bundled
                    - image: fedora:41
                      deps: dnf install -y libX11 libxcb mesa-libGL mesa-libEGL mesa-libgbm libdrm alsa-lib fontconfig freetype expat zlib dbus-libs systemd-libs libwayland-client libwayland-cursor libwayland-egl libglvnd-opengl libglvnd-gles libstdc++
                    - image: debian:12
                      deps: apt-get update && apt-get install -y --no-install-recommends libx11-6 libx11-xcb1 libxcb1 libgl1 libegl1 libgbm1 libdrm2 libopengl0 libgles2 libasound2 libfontconfig1 libfreetype6 libexpat1 zlib1g libdbus-1-3 libsystemd0 libudev1 libwayland-client0 libwayland-cursor0 libwayland-egl1 libstdc++6
                    - image: archlinux:latest
                      deps: pacman -Syu --noconfirm --needed libx11 libxcb mesa libglvnd libdrm alsa-lib fontconfig freetype2 expat zlib dbus systemd-libs wayland gcc-libs
        steps:
            - uses: actions/download-artifact@v4
              with:
                  name: portable-mpv

            - name: Test clips
              run: |
                  sudo apt-get update && sudo apt-get install --no-install-recommends -y ffmpeg
                  ffmpeg -loglevel error -f lavfi -i testsrc=d=2:s=640x360:r=25 -f lavfi -i sine=d=2 -c:v libx264 -c:a aac h264-aac.mp4
                  ffmpeg -loglevel error -f lavfi -i testsrc=d=2:s=640x360:r=25 -f lavfi -i sine=d=2 -c:v libx265 -c:a ac3 hevc-ac3.mkv
                  ffmpeg -loglevel error -f lavfi -i testsrc=d=2:s=640x360:r=25 -f lavfi -i sine=d=2 -c:v libx264 -c:a mp2 -f mpegts live.ts
                  tar -xzf portable-mpv.tar.gz

            - name: Play them with the bundled mpv
              run: |
                  docker run --rm -v "$PWD:/w" -w /w ${{ matrix.image }} sh -c '
                    set -e
                    ${{ matrix.deps }} >/dev/null
                    for f in h264-aac.mp4 hevc-ac3.mkv live.ts; do
                      out=$(bin/mpv/mpv --no-config --vo=null --ao=null "$f" 2>&1)
                      echo "$out" | grep -q "^VO:" && echo "$out" | grep -q "^AO:" && echo "$out" | grep -q "End of file" \
                        || { echo "$out"; echo "FAILED: $f"; exit 1; }
                      echo "OK $f"
                    done'

    snap:
        name: Snap (core24, strict)
        needs: electron
        runs-on: ubuntu-24.04
        timeout-minutes: 60
        steps:
            - uses: actions/checkout@v4

            - uses: actions/download-artifact@v4
              with:
                  name: mpx-player-linux-unpacked

            - name: Unpack the Electron build for snapcraft
              run: mkdir -p build/linux-unpacked && tar -C build/linux-unpacked -xzf mpx-player-linux-x64.tar.gz

            - uses: snapcore/action-build@v1
              id: snapcraft

            - name: Install the snap and run the smoke test inside its confinement
              run: |
                  sudo apt-get update && sudo apt-get install --no-install-recommends -y xvfb
                  sudo snap install --dangerous "${{ steps.snapcraft.outputs.snap }}"
                  snap connections mpx-player
                  timeout 600 xvfb-run -a node tools/linux/smoke-test.mjs --expect-embedded-mpv --expect-panel-key \
                      --screenshot=smoke-snap.png -- /snap/bin/mpx-player

            - uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: mpx-player-snap
                  path: |
                      ${{ steps.snapcraft.outputs.snap }}
                      smoke-snap.png

    flatpak:
        name: Flatpak (freedesktop 26.08)
        needs: electron
        runs-on: ubuntu-24.04
        timeout-minutes: 90
        steps:
            - uses: actions/checkout@v4

            - uses: actions/download-artifact@v4
              with:
                  name: mpx-player-linux-unpacked
                  path: flatpak

            - name: Flatpak tooling and runtimes
              run: |
                  sudo apt-get update
                  sudo apt-get install --no-install-recommends -y flatpak flatpak-builder elfutils xvfb dbus-x11
                  flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
                  flatpak install --user -y --noninteractive flathub org.flatpak.Builder

            - name: Cache mpv modules
              uses: actions/cache@v4
              with:
                  path: flatpak/.flatpak-builder
                  key: flatpak-builder-${{ hashFiles('flatpak/com.latmpx.MPXPlayer.yml') }}
                  restore-keys: flatpak-builder-

            - name: Build and install
              working-directory: flatpak
              run: |
                  flatpak-builder --user --install-deps-from=flathub --install --force-clean \
                      --repo=repo build-dir com.latmpx.MPXPlayer.yml
                  flatpak build-bundle repo mpx-player.flatpak com.latmpx.MPXPlayer

            - name: Smoke test inside the Flatpak sandbox
              run: |
                  timeout 600 xvfb-run -a dbus-run-session -- node tools/linux/smoke-test.mjs --expect-embedded-mpv --expect-panel-key \
                      --screenshot=smoke-flatpak.png -- flatpak run com.latmpx.MPXPlayer

            - name: Flathub linter (report only)
              continue-on-error: true
              run: |
                  flatpak run --command=flatpak-builder-lint org.flatpak.Builder manifest flatpak/com.latmpx.MPXPlayer.yml
                  flatpak run --command=flatpak-builder-lint org.flatpak.Builder repo flatpak/repo

            - uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: mpx-player-flatpak
                  path: |
                      flatpak/mpx-player.flatpak
                      smoke-flatpak.png

    release:
        name: GitHub release
        # only when every package built and passed its tests
        needs: [electron, portable-mpv, snap, flatpak]
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/download-artifact@v4
              with:
                  path: artifacts
                  merge-multiple: true

            - name: Publish
              env:
                  GH_TOKEN: ${{ github.token }}
                  TAG: ${{ startsWith(github.ref, 'refs/tags/linux-v') && github.ref_name || format('linux-v{0}', needs.electron.outputs.version) }}
              run: |
                  # artifacts keep their folders (dist/executables/, flatpak/): collect the packages flat
                  mkdir release
                  find artifacts -type f \( -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' -o -name '*.snap' \) -exec cp {} release/ \;
                  cp "$(find artifacts -type f -name mpx-player.flatpak)" "release/MPX-Player-${TAG#linux-v}-linux-x86_64.flatpak"
                  ls -la release
                  test "$(ls release | wc -l)" -eq 5
                  gh release create "${TAG}" release/* \
                      --repo "${GITHUB_REPOSITORY}" \
                      --target "${GITHUB_SHA}" \
                      --title "MPX Player Linux ${TAG#linux-v}" \
                      --notes "MPX Player para Linux x64, con MPV integrado.
                  - AppImage: cualquier distribución (chmod +x y abrir; en Ubuntu 22.04+ instalar libfuse2 o usar --appimage-extract-and-run).
                  - .deb (Ubuntu, Debian, Mint) y .rpm (Fedora, openSUSE).
                  - .snap y .flatpak: los mismos paquetes que se envían a la Snap Store y a Flathub (instalación de prueba: snap install --dangerous / flatpak install --user)."

